spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/kintai_app_dev
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.separator=;;

spring.sql.init.mode=always

# セッション永続化（ブラウザを閉じても30日間ログイン状態を維持）
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.same-site=lax

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.api.mapper.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.api.mapper.handler
