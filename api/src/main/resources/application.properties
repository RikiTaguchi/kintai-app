spring.application.name=api

# データソース（環境変数で上書き可能。ローカル開発用デフォルト値を維持）
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kintai_app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# スキーマ・初期データ投入（本番では never を推奨）
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.separator=;;

# セッション Cookie (JSESSIONID) の属性（環境で切替可能）
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:Lax}

# アプリ側で発行する Cookie（user_role など）の属性
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAMESITE:Lax}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.api.mapper.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.api.mapper.handler
