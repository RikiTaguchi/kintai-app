version: "3.9"

services:

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.16.2.17:5432/kintai_app_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: Asia/Tokyo
    ports:
      - "8080:8080"
    restart: always
  
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://api:8080
    environment:
      # Route Handler（/api/excel/payslips 等）がサーバーサイドでバックエンドを参照するため
      # ビルド ARG（rewrite 用）と別途ランタイムでも必要
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always
